name: Publish

on:
  release:
    types:
      - created

  workflow_dispatch:

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/test.yml

  publish:
    name: "Publish Packages"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
        run: |
          cd packages

          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc

          for package in */; do
            cd "$package"
            npm publish || true
            sleep 10
            cd ..
          done

  upload-agent-skill:
    name: Upload Agent Skill ZIP
    needs: publish
    runs-on: ubuntu-latest

    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_PREFIX: ${{ vars.R2_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine Release Version
        run: |
          echo "RELEASE_VERSION=$(node -p "require('./packages/js-moi/package.json').version")" >> "$GITHUB_ENV"

      - name: Prepare Release Artifact
        run: |
          mkdir -p release
          cd js-moi-skills
          zip -r ../release/js-moi-sdk-${RELEASE_VERSION}-skills.zip .

      - name: Verify Generated ZIP
        run: |
          unzip -l release/js-moi-sdk-${RELEASE_VERSION}-skills.zip


      - name: Upload Agent Skill ZIP to Cloudflare R2
        run: |
          aws s3 cp \
            release/ \
            s3://${R2_BUCKET}/${R2_PREFIX}/ \
            --recursive \
            --endpoint-url=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

      - name: Verify uploaded files
        run: |
          aws s3 ls \
            s3://${R2_BUCKET}/${R2_PREFIX}/ \
            --recursive \
            --endpoint-url=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
